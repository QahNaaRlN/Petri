[package]
name = "petri"
version = "0.3.0"
edition = "2021"
rust-version = "1.99"
description = "Fail-closed laboratories for coding agents"
license = "MIT"

[dependencies]
anyhow = "1"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
directories = "6"
flate2 = "1"
git2 = { version = "0.21", default-features = false, features = ["vendored-libgit2"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = { version = "2", default-features = false, features = ["deserialize"] }
tar = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.11"
hex = "0.4"
fs2 = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Isolation", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Memory", "Win32_System_Environment", "Win32_System_SystemInformation", "Win32_System_IO"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
